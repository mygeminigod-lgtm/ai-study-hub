          list = list.filter(t => t.category === selectedCategory);

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          const terms = q.split(/\s+/).filter(Boolean);
          list = list.filter(tool => {
            const name = tool.name.toLowerCase();
            const desc = tool.description.toLowerCase();
            const cat = tool.categoryName.toLowerCase();
            const tags = tool.tags.map(t => t.toLowerCase());
            const best = tool.bestFor.map(b => b.toLowerCase());
            return terms.every(term => 
              name.includes(term) || desc.includes(term) || cat.includes(term) ||
              tags.some(t => t.includes(term)) || best.some(b => b.includes(term))
            );
          });
        }

        if (sortBy === 'featured') {
          list.sort((a, b) => {
            const aFav = favoriteIds.includes(a.id) ? 1 : 0;
            const bFav = favoriteIds.includes(b.id) ? 1 : 0;
            if ((a.featured ? 1 : 0) !== (b.featured ? 1 : 0)) {
              return (b.featured ? 1 : 0) - (a.featured ? 1 : 0);
            }
            if (aFav !== bFav) return bFav - aFav;
            return a.name.localeCompare(b.name);
          });

          list.sort((a, b) => a.name.localeCompare(b.name));

          list.sort((a, b) => a.categoryName.localeCompare(b.categoryName) || a.name.localeCompare(b.name));

                            }`}
                          >
                            <i data-lucide="heart" className={`w-4 h-4 ${isFav(tool.id) ? 'fill-red-400 text-red-400' : ''}`}></i>
                          </button>
                        </div>

                        <p className="text-xs text-slate-300 line-clamp-2 leading-relaxed mb-4">
                          {tool.description}
                        </p>

                        <div className="mb-4">
                          <span className="text-[10px] font-semibold tracking-wider uppercase text-slate-400 block mb-1">
                            Best for:
                          </span>
                          <p className="text-xs text-slate-300 leading-snug">
                            {tool.bestFor.slice(0, 3).join(' • ')}
                          </p>
                        </div>
                      </div>

                      <div className="pt-3 border-t border-slate-800/70 flex items-center justify-between gap-2">
                        <button
                          onClick={e => { e.stopPropagation(); setModalTool(tool); }}
                          className="text-xs font-medium text-slate-400 hover:text-white px-2 py-1.5 rounded-lg"
                        >
                          Learn More
                        </button>

                        <a
                          href={tool.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          onClick={e => e.stopPropagation()}
                          className="flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-xl transition shadow-md shadow-blue-600/20"
                        >
                          <span>Open {tool.name.split(' ')[0]}</span>
                          <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </main>

          {/* DETAIL MODAL */}
          {modalTool && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md"
              onClick={() => setModalTool(null)}
            >
              <div
                className="relative w-full max-w-lg bg-[#0d121c] border border-slate-700 rounded-2xl p-6 sm:p-7 shadow-2xl"
                onClick={e => e.stopPropagation()}
              >
                <button
                  onClick={() => setModalTool(null)}
                  className="absolute top-5 right-5 p-2 rounded-xl text-slate-400 hover:text-white bg-slate-900 border border-slate-800"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                <div className="flex items-start gap-4 mb-4">
                  <div className="p-3 rounded-2xl bg-slate-800 border border-slate-700">
                    <i data-lucide={modalTool.icon} className="w-7 h-7 text-cyan-400"></i>
                  </div>
                  <div>
                    <h3 className="text-xl font-bold text-white">{modalTool.name}</h3>
                    <span className="text-xs px-2.5 py-0.5 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/30">
                      {modalTool.categoryName}
                    </span>
                  </div>
                </div>

                <p className="text-sm text-slate-300 leading-relaxed mb-4">
                  {modalTool.description}
                </p>

                {modalTool.studentBonus && (
                  <div className="p-3 rounded-xl bg-blue-950/40 border border-blue-800/40 text-xs text-blue-300 mb-4">
                    <span className="font-semibold text-blue-200 block mb-0.5">Student & Exam Advantage:</span>
                    {modalTool.studentBonus}
                  </div>
                )}

                <div className="mb-4">
                  <h4 className="text-xs font-semibold uppercase text-slate-400 mb-2">Best For</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs text-slate-200">
                    {modalTool.bestFor.map((item, i) => (
                      <div key={i} className="flex items-center gap-1.5 p-1.5 rounded bg-slate-900 border border-slate-800">
                        <span className="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                        <span>{item}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex items-center gap-3 pt-4 border-t border-slate-800">
                  <button
                    onClick={() => toggleFavorite(modalTool.id)}
                    className={`flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border text-xs font-semibold ${
                      isFav(modalTool.id)
                        ? 'bg-red-500/10 border-red-500/40 text-red-400'
                        : 'bg-slate-900 border-slate-800 text-slate-300 hover:text-white'
                    }`}
                  >
                    <i data-lucide="heart" className={`w-4 h-4 ${isFav(modalTool.id) ? 'fill-red-400' : ''}`}></i>
                    <span>{isFav(modalTool.id) ? 'Favorited' : 'Add to Favorites'}</span>
                  </button>

                  <a
                    href={modalTool.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-lg shadow-blue-600/30"
                  >
                    <span>Open {modalTool.name}</span>
                    <i data-lucide="external-link" className="w-4 h-4"></i>
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-20 border-t border-slate-800 bg-[#07090e] pt-10 pb-12 text-slate-400 text-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center sm:text-left">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pb-6 border-b border-slate-800/60">
                <div className="flex items-center gap-2">
                  <i data-lucide="graduation-cap" className="w-4 h-4 text-cyan-400"></i>
                  <span className="text-base font-bold text-white">AI Study Hub — AP & Coursework Edition</span>
                </div>
                <p className="text-slate-400">
                  “Your gateway to the best AI tools for AP exams, studying, research, coding, and creative work.”
                </p>
              </div>
              <div className="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-[11px] text-slate-500">
                <p>AI Study Hub is an independent tool directory and is not affiliated with the listed services or the College Board.</p>
                <p>Built for students, researchers, and creators worldwide.</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
